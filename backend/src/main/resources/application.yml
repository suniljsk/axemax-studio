server:
  port: 8080
spring:
  application:
    name: axemax-studio-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/axemax}
    username: ${SPRING_DATASOURCE_USERNAME:axemax}
    password: ${SPRING_DATASOURCE_PASSWORD:change-this-local-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-bytes}
    expiration-minutes: 30
  admin:
    email: ${ADMIN_EMAIL:admin@axemax.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!ReplaceBeforeUse}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@axemaxstudio.com}
  sms:
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
