services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axemax}
      POSTGRES_USER: ${POSTGRES_USER:-axemax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    volumes:
      - axemax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axemax} -d ${POSTGRES_DB:-axemax}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-axemax}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-axemax}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-at-least-32-bytes}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@axemax.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!ReplaceBeforeUse}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  axemax_pgdata:
